*{box-sizing:border-box}

.foot{color:var(--muted);font-size:12px;text-align:center;margin:24px 0 8px}
.warn{background:rgba(255,122,26,.15);border:1px solid var(--accent);color:var(--text);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}

.r1 td{background:rgba(255,200,61,.16)}
.r2 td{background:rgba(110,160,255,.16)}

.b1{background:#ffc83d}
.b2{background:#8fb8ff}

.team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:10px}
.team-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.team-card h3{font-size:16px;margin:0 0 6px;overflow-wrap:anywhere}
.team-card .btn{margin-top:10px}
.member{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.member:last-child{border-bottom:0}
.member-main{min-width:0;overflow-wrap:anywhere}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.photo-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;min-width:0}
.photo-card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:7px;background:var(--bg)}
.photo-card .caption{font-size:13px;overflow-wrap:anywhere;margin-top:6px}
.photo-card .meta{display:block;overflow-wrap:anywhere;margin-top:3px}
input[type=file]{padding:8px}
.form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* Refined visual system: polished basketball dashboard, with restrained motion. */

html{scroll-behavior:smooth;scroll-padding-top:90px}

main{max-width:1080px;padding:24px clamp(14px,3vw,32px) 34px}
h1{display:flex;align-items:center;gap:8px;font-size:clamp(24px,3vw,34px);font-weight:850;letter-spacing:-.045em;margin:8px 0 6px;line-height:1.2}

.panel{padding:16px;background:var(--card)}
.m{padding:15px;margin-bottom:12px;background:var(--card)}

.chip{border-radius:10px}

.warn{border-radius:13px;box-shadow:var(--shadow)}
.foot{line-height:1.8;margin-top:30px}

@keyframes viewRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.tabs button.on{animation:softPulse 3.2s ease-in-out infinite}

.lightbox-close{position:absolute;top:18px;right:20px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);color:#fff;font-size:30px;line-height:1;cursor:pointer}
.lightbox-caption{color:#fff;text-align:center;font-size:14px;max-width:90vw;overflow-wrap:anywhere}
@keyframes lightboxIn{from{opacity:0}to{opacity:1}}
@keyframes photoIn{from{opacity:.5;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
@media(hover:hover){.btn:hover,.utility-btn:hover{transform:translateY(-2px);border-color:rgba(255,133,46,.55);box-shadow:0 8px 22px rgba(0,0,0,.13)}.team-card:hover,.photo-card:hover,.m:hover,.panel:hover{border-color:rgba(255,133,46,.28);box-shadow:var(--shadow)}.team-card:hover{transform:translateY(-3px)}.photo-card:hover{transform:translateY(-2px)}}
@media(max-width:640px){main{padding:17px 12px 25px}h1{font-size:24px}.site-controls{justify-content:flex-start;margin-bottom:14px}.utility-btn{padding:8px 10px}.tabs{top:4px;border-radius:13px}.tabs button{padding:10px 12px;font-size:14px}.row{gap:7px}.panel{padding:13px}.m{padding:12px}.search-hint{display:none}th,td{padding:10px}}

function compressPhoto(file){
  return new Promise(function(resolve){
    if(!file||!/^image\//i.test(file.type)){resolve(null);return;}
    var reader=new FileReader();
    reader.onerror=function(){resolve(null);};
    reader.onload=function(){
      var img=new Image();
      img.onerror=function(){resolve(null);};
      img.onload=function(){
        try{
          var max=1400,scale=Math.min(1,max/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
          var canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));canvas.height=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
          var ctx=canvas.getContext('2d');if(!ctx){resolve(null);return;}
          ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
          canvas.toBlob(function(blob){
            if(!blob){resolve(null);return;}
            var r2=new FileReader();r2.onerror=function(){resolve(null);};r2.onload=function(){resolve({dataUrl:r2.result,name:(file.name||'照片').slice(0,120),size:blob.size});};r2.readAsDataURL(blob);
          },'image/jpeg',0.76);
        }catch(e){resolve(null);}
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
